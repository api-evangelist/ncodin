aid: ncodin
name: NcodiN
description: >-
  NcodiN is a French deep-tech company developing optical interconnect technology
  for high-performance computing and AI infrastructure. Founded in Palaiseau, France,
  the company builds miniaturized lasers integrated directly on silicon to replace
  traditional copper connections between chiplets and processors, aiming to break
  the "copper wall" that limits AI scaling. Its photonic interconnects promise
  petabit-per-second bandwidth with roughly a thousand times less energy to move
  data than copper links, targeting AI, telecommunications, autonomous driving,
  smart cities, healthcare, and climate modeling. NcodiN is backed by venture firms
  including Earlybird, Elaia, OVNI Capital, and Verve Ventures, is advised by major
  chip and equipment makers such as NVIDIA, Qualcomm, Intel, and ASML, and joined
  the FrenchTech2030 cohort in November 2025. As a semiconductor and photonics
  hardware company it sells to chipmakers and does not currently expose a public
  developer API, SDK, or developer documentation surface.
